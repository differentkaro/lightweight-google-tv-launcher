# Copy this file to config.properties and fill in your own values.
# config.properties is git-ignored -- it never gets committed.
#
# build.sh reads this file and generates build/gen/com/lighthome/tv/AppConfig.java
# from it on every build. Nothing here ends up in src/ or version control.

# --- TMDB credentials -------------------------------------------------------
# tmdb_key may be either:
#  - a v4 read access token (starts with "eyJ") -> sent as "Authorization: Bearer ..."
#  - a v3 API key (plain string) -> sent as ?api_key=...
# Get one free at https://www.themoviedb.org/settings/api
# Leave empty to build without it: the app still builds and runs, the featured
# area just shows a calm "no key configured" fallback instead of real titles.
tmdb_key=

# ISO-3166-1 country code used as the watch-provider catalogue region for the
# fallback/trending availability checks (e.g. which providers' /watch/providers
# region to look at). This is NOT the same as priority_country below.
region=US

# --- Priority-country featured titles (optional) ---------------------------
# When set, titles whose TMDB origin_country matches this ISO-3166-1 code are
# boosted in the featured mix (+0.25 score bonus, a guaranteed minimum slot
# count, and a front-slide placement rule). Leave empty to disable this
# entirely -- the featured mix is then pure global trending + fallback, with
# no special-cased country and no chip.
#
# Example (shown here only as an example of the kind of local/regional
# catalogue this was originally built around -- substitute your own):
#   priority_country=NG
priority_country=

# Small text chip drawn on priority-country titles in the hero area, e.g.
# "Nollywood" for priority_country=NG. Leave empty to hide the chip even if
# priority_country is set.
priority_label=

# Minimum number of priority-country titles guaranteed among the 12 featured
# slots, if the pools have that many available. 0 (default) means no
# guarantee and no front-slide rule -- used automatically when
# priority_country is empty.
priority_min=0

# If the priority-country pool doesn't have priority_min items within
# window_months, the fetch widens its release-date cutoff up to this many
# months back (and stops there) before giving up.
priority_max_age_months=24

# Rolling release-date window (in months, counted back from today) used for
# the trending and fallback pools, and as the starting point for the
# priority-country pool before any widening above.
window_months=12

# --- Streaming providers ----------------------------------------------------
# Comma-separated list of "name:tmdb_watch_provider_id(s):android_package".
# A provider's TMDB watch-provider id(s) can be found at
# https://www.themoviedb.org/documentation/api/discover -- some providers
# (e.g. Amazon's two Prime Video ids) need more than one id, pipe-separated.
#
# Each provider is checked against the `region` above by default. Add
# "<name>_region=<ISO code>" to override an individual provider's region --
# useful when a provider's catalogue in your country is actually served from
# a different region's catalogue (the Apple TV+ case below is the original
# motivating example: many countries only get Apple TV+'s US catalogue).
providers=netflix:8:com.netflix.ninja,prime:9|119:com.amazon.amazonvideo.livingroom,appletv:350:com.apple.atve.androidtv.appletv
appletv_region=US

# --- Remote-control button remap (optional) ---------------------------------
# Comma-separated list of "androidKeyCode:android_package". Lets you remap
# specific remote-control buttons (captured as raw Android key codes) to open
# an app of your choice via an AccessibilityService, bypassing whatever the
# TV firmware's own handler does with that button.
#
# EMPTY BY DEFAULT. With no mapping, RemoteKeys.hasAnyMapping() is false and
# the accessibility service is never enabled -- the feature is entirely
# dormant on a build that hasn't configured it. See docs/TCL-NOTES.md for how
# the example codes below were captured and why they're TCL-specific.
#
# Example only -- these keycodes were observed on ONE TCL Google TV running
# Android 11 (TCL RC902V remote). Your remote and firmware almost certainly
# use different codes; you would need to capture your own (e.g. via
# `getevent`/logcat against the platform's key dispatcher) before this example
# means anything on your hardware:
#   TCL_GUARD        4140
#   TCL_USB_MEDIA    4057
#   TCL_QUICK_MENU   4020
#   TCL_NETFLIX      4062
#   TCL_PRIMEVIDEO   4099
#   TCL_YOUTUBE      4065
# e.g. to send the Netflix and Prime Video buttons to their respective apps:
#   remote_keys=4062:com.netflix.ninja,4099:com.amazon.amazonvideo.livingroom
remote_keys=

# --- Default hidden apps -----------------------------------------------------
# Comma-separated package names hidden from the app grid on first run (the
# user can always un-hide any app from the grid's long-press menu). Generic
# AOSP defaults only -- add your own if you want other apps hidden by default.
default_hidden_packages=com.android.camera2,com.android.messaging
